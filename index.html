<!--
  功能說明：電子聯絡簿系統 - 雙軌完整旗艦版 (支援 IndexedDB 記憶檔案 + 斷網覆寫本地 PPT 投影 + 演講者備忘錄安全讀寫 + PWA)
  代碼產生日期與時間：2026-10-23 14:35
-->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子聯絡簿寫入系統</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#198754">

  <!-- 本機離線 PPTX 生成引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

  <script>
    if (window.top !== window.self) {
      try { window.top.location.href = window.location.href; } catch (e) {
        console.warn("無法跳脫 iframe，維持當前視窗模式");
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.warn('Service Worker 註冊略過：', err));
      });
    }
  </script>
  <style>
    :root {
      --primary-green: #0f5132;
      --btn-green: #198754;
      --btn-green-hover: #146c43;
      --btn-dark: #212529;
      --btn-dark-hover: #1c1f23;

      --btn-danger: #dc3545;
      --btn-secondary: #6c757d;
      --speaker-bg: #eef2ff;
      --speaker-border: #4f46e5;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --border-color: #dee2e6;
      --draft-border: #dc3545;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px;
    }

    h2 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    input[type="password"],
    input[type="date"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      background-color: #fff;
    }

    input:focus, textarea:focus {

      border-color: #86b7fe;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);

      gap: 8px;

    }

    .date-row input[type="date"] {

    .btn {

      padding: 14px;
      border: none;
      border-radius: 8px;

      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;

    .btn:active { transform: scale(0.99); }
    .btn:disabled {
      background-color: #adb5bd !important;

    .btn-submit { background-color: var(--btn-green); }

    .btn-warning { background-color: var(--btn-warning); color: #000; }
    .btn-danger { background-color: var(--btn-danger); }
    .btn-secondary { background-color: var(--btn-secondary); }

    .status-box {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;

      color: #495057;

    .draft-section {

    .action-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;

      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 16px;
    }
    .modal-card {
      background: #fff;
      padding: 24px;
      border-radius: var(--radius);
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 520px) {
      .grid-2col { grid-template-columns: 1fr; }
      .schedule-bar, .local-file-bar { flex-direction: column; align-items: flex-start; }
      .action-row { flex-direction: column; }
      .action-row .btn-sm { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📝 電子聯絡簿寫入系統</h2>
  
  <div class="form-group">
    <label for="pwd">🔑 授權密碼：</label>
    <input type="password" id="pwd" placeholder="請先驗證密碼以解鎖寫入權限...">
  </div>

  <div class="form-group">
    <label for="targetDate">📅 選擇同步日期：</label>
    <div class="date-row">

  <div id="localFileBar" class="local-file-bar">

  </div>

  <!-- 1. 成績科目標籤 -->
  <div class="form-group">
    <label>📊 今日有成績科目：</label>
    <div class="chip-container" id="formalScoreChips">
      <div class="chip" data-sub="國文" onclick="toggleChip(this)">國文</div>
      <div class="chip" data-sub="英語" onclick="toggleChip(this)">英語</div>

  <div class="grid-2col form-group">

      <label for="formalExam">📌 正式考試內容：</label>
      <textarea id="formalExam" rows="7" placeholder="連線驗證後自動帶入..."></textarea>
    </div>
    <div>
      <label for="formalHomework">✍️ 正式作業內容：</label>

  </div>

  <!-- 4. 投影片演講者備忘錄 -->
  <div class="speaker-card">

    <textarea id="formalSpeakerNotes" rows="3" placeholder="例如：課堂重點講稿、待收回條、家長聯絡記錄... (系統已自動保護日期標記)"></textarea>
  </div>

  <button class="btn btn-preview" onclick="manualTriggerRead()">☁️ 讀取雲端投影片內容</button> 
  
  <button id="btnWrite" class="btn btn-submit" onclick="handleWrite()">
    💾 修改並寫入 (本機 PPT 覆寫 + 雲端同步)

        <div class="chip" data-sub="國文" onclick="toggleDraftChip(this)">國文</div>
        <div class="chip" data-sub="英語" onclick="toggleDraftChip(this)">英語</div>

        <label for="draftHomework">✍ 暫存作業：</label>
        <textarea id="draftHomework" rows="4" placeholder="離線時輸入作業草稿..." oninput="autoSaveDraft()"></textarea>
      </div>

    <div class="form-group" style="margin-bottom:12px;">
      <label for="draftNote">📢 暫存公開備註：</label>
      <textarea id="draftNote" rows="2" placeholder="離線時輸入公開備註草稿..." oninput="autoSaveDraft()"></textarea>
    </div>

    <div class="form-group" style="margin-bottom:12px;">
      <label for="draftSpeakerNotes">🎙️ 暫存演講者備忘錄：</label>
      <textarea id="draftSpeakerNotes" rows="2" placeholder="離線時輸入演講者備忘稿草稿..." oninput="autoSaveDraft()" style="background-color:#eef2ff;"></textarea>
    </div>

    <div class="action-row">
      <button class="btn btn-sm btn-warning" onclick="copyDraftToFormal()">⚡ 一鍵複製草稿到正式區</button>
      <button class="btn btn-sm btn-secondary" onclick="loadDraftForCurrentDate()">🔄 載入草稿</button>
      <button class="btn btn-sm btn-danger" onclick="clearDraftForCurrentDate()">🗑️ 清除草稿</button>

<div id="authModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-title">🔐 網路連線正常，請驗證身分</div>
    <p style="font-size: 0.9rem; color: #6c757d; margin-bottom: 16px;">
      系統已偵測到連線通暢。為防止誤寫覆蓋，請輸入授權密碼以自動帶入雲端簡報內容：
    </p>
    <input type="password" id="modalPwdInput" placeholder="請輸入授權密碼..." style="margin-bottom: 16px;">
    <button class="btn btn-submit" onclick="submitAuthAndRead()">確認並自動載入雲端內容</button>
  </div>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxm7i2Zh80lsjZp5Mf3TkyeEQvurZEcEqHhEdDrbNU7eNbRyalwubozpI5Ed7wcm-XpTg/exec";

  let targetMinute = 30;
  let nextTargetSyncTimestamp = 0;
  let lastSyncedDataHash = "";
  let hasReadCurrentDate = false;
  let isOnlineState = false;
  let bgWorker = null;
  let dateChangeDebounceTimer = null;
  let localFileHandle = null;

  window.onerror = function(msg, url, line) {
    showStatus(`執行異常 (行號 ${line}): ${msg}`, true);
    return false;
  };

  /* IndexedDB 存取控制代碼 */
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("PptxHandleDB", 1);
      req.onupgradeneeded = (e) => e.target.result.createObjectStore("handles");
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function saveHandleToDB(handle) {
    const db = await openDB();
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(handle, "activePptxHandle");
  }

  async function getHandleFromDB() {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction("handles", "readonly");
      const req = tx.objectStore("handles").get("activePptxHandle");
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  }

  /* 啟動時自動還原檔案設定 */
  async function autoRestoreLocalFile() {
    try {
      const handle = await getHandleFromDB();
      if (!handle) return;

      const opts = { mode: 'readwrite' };
      if ((await handle.queryPermission(opts)) === 'granted') {
        localFileHandle = handle;
        setFileUIReady(handle.name);
      } else {
        localFileHandle = handle;
        document.getElementById("localFileStatus").innerText = `📂 已記憶 [${handle.name}] (待授權)`;
        document.getElementById("btnSelectFile").innerText = "⚡ 點此一鍵授權";
      }
    } catch (e) {
      console.warn("無法自動還原控制代碼：", e);
    }
  }

  function setFileUIReady(name) {
    document.getElementById("localFileBar").classList.add("ready");
    document.getElementById("localFileStatus").innerText = `✅ 已連結投影檔: ${name}`;
    document.getElementById("btnSelectFile").innerText = "🔄 更換檔案";
  }

  async function selectOrVerifyLocalPpt() {
    if (!('showOpenFilePicker' in window)) {
      alert("目前瀏覽器不支援本機檔案直接寫入，請使用 Chrome 或 Edge！");
      return;
    }
    try {
      if (localFileHandle && (await localFileHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') {
        const perm = await localFileHandle.requestPermission({ mode: 'readwrite' });
        if (perm === 'granted') {
          setFileUIReady(localFileHandle.name);
          showStatus(`已恢復對 [${localFileHandle.name}] 的寫入授權！`, false);
          return;
        }
      }

      const [handle] = await window.showOpenFilePicker({
        types: [{
          description: 'PowerPoint 簡報檔',
          accept: { 'application/vnd.openxmlformats-officedocument.presentationml.presentation': ['.pptx'] }
        }],
        multiple: false
      });

      localFileHandle = handle;
      await saveHandleToDB(handle);
      setFileUIReady(handle.name);
      showStatus(`成功連結並記憶本機投影檔案: ${handle.name}！`, false);
    } catch (err) {
      if (err.name !== 'AbortError') showStatus(`設定檔案失敗: ${err.message}`, true);
    }
  }

  /* 使用 PptxGenJS 生成投影片並直接覆寫本地檔案 */
  async function writeToLocalPptxFile(data) {
    if (!localFileHandle) return false;
    try {
      if ((await localFileHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') {
        const perm = await localFileHandle.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') return false;
      }

      const pptx = new PptxGenJS();
      pptx.layout = 'LAYOUT_16x9';
      const slide = pptx.addSlide();
      
      slide.addText(`📅 聯絡簿 - ${data.date}`, { x: 0.5, y: 0.4, w: 9.0, h: 0.5, fontSize: 20, bold: true, color: '198754' });

      const scoreText = data.scoreSubjects.length > 0 ? data.scoreSubjects.join('、') : "無";
      slide.addText(`📊 今日有成績科目：${scoreText}`, { x: 0.5, y: 1.0, w: 9.0, h: 0.4, fontSize: 14, bold: true, color: '0f5132' });

      const tableData = [
        [
          { text: "📌 考試內容", options: { bold: true, fill: 'e9ecef', align: 'center' } },
          { text: "✍️ 作業內容", options: { bold: true, fill: 'e9ecef', align: 'center' } }
        ],
        [
          { text: data.exam || "(本日無排定考試)", options: { valign: 'top' } },
          { text: data.homework || "(本日無作業)", options: { valign: 'top' } }
        ]
      ];
      slide.addTable(tableData, { x: 0.5, y: 1.5, w: 9.0, h: 3.5, colW: [4.5, 4.5], border: { pt: 1, color: 'ced4da' } });
      slide.addText(`📢 備註：${data.note || "無"}`, { x: 0.5, y: 5.2, w: 9.0, h: 0.8, fontSize: 13, color: '495057', fill: 'f8f9fa' });

      if (data.speakerNotes) {
        slide.addNotes(data.speakerNotes);
      }

      const blob = await pptx.write("blob");
      const writable = await localFileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
      return true;
    } catch (err) {
      console.error("本機寫入失敗：", err);
      showStatus(`本機 PPT 寫入失敗 (請確認檔案未在 PowerPoint 中被鎖定): ${err.message}`, true);
      return false;
    }
  }

  async function hashPassword(plainText) {
    if (!plainText) return "";
    const encoder = new TextEncoder();
    const data = encoder.encode(plainText);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function sendJsonpRequest(action, dataParams = {}) {
    return new Promise((resolve, reject) => {
      const callbackName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      const script = document.createElement('script');
      script.crossOrigin = "anonymous";

      const queryParams = new URLSearchParams({
        action: action,
        callback: callbackName,
        _ts: Date.now(),
        ...dataParams
      });

      const timer = setTimeout(() => {
        cleanup();
        reject(new Error("連線逾時 (8秒)：可能處於校園 10 分鐘斷網期間。"));
      }, 8000);

      function cleanup() {
        clearTimeout(timer);
        if (window[callbackName]) delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[callbackName] = (response) => {
        cleanup();
        if (response && response.status === "error") {
          reject(new Error(response.message || "處理錯誤"));
        } else {
          resolve(response);
        }
      };

      script.onerror = () => {
        cleanup();
        reject(new Error("網路請求失敗，已切換至本機模式。"));
      };

      script.src = `${GAS_WEB_APP_URL}?${queryParams.toString()}`;
      document.body.appendChild(script);
    });
  }

  function showStatus(msg, isError = false) {
    const box = document.getElementById("statusBox");
    if (!box) return;
    box.style.display = "block";
    box.style.backgroundColor = isError ? "#f8d7da" : "#d1e7dd";
    box.style.color = isError ? "#842029" : "#0f5132";
    box.style.border = isError ? "1px solid #f5c2c7" : "1px solid #badbcc";
    box.innerHTML = (isError ? "❌ " : "✅ ") + msg;
  }

  function updateInlineMsg(text, type = "normal") {
    const box = document.getElementById("inlineMsgBox");
    const content = document.getElementById("inlineMsgContent");
    if (!box || !content) return;

    content.innerText = text;
    box.classList.remove("offline", "active");
    if (type === "offline") box.classList.add("offline");
    if (type === "active") box.classList.add("active");
  }

  function updateCountdownUI() {
    const badge = document.getElementById("countdownBadge");
    if (!badge || nextTargetSyncTimestamp === 0) return;

    const diff = nextTargetSyncTimestamp - Date.now();
    if (diff <= 0) {
      badge.innerText = "00:00 (觸發中)";
      return;
    }
    const totalSeconds = Math.floor(diff / 1000);
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    badge.innerText = `倒數 ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  async function checkNetworkProbe() {
    updateInlineMsg("🔍 正在嘗試連線雲端服務...", "normal");
    try {
      await sendJsonpRequest("ping");
      isOnlineState = true;
      updateInlineMsg(`🌐 連線正常！請驗證身分載入簡報。`, "normal");
      
      const pwd = document.getElementById("pwd").value.trim();
      if (!pwd) {
        document.getElementById("authModal").style.display = "flex";
        document.getElementById("modalPwdInput").focus();
      } else {
        executeRead(false);
      }
    } catch (e) {
      isOnlineState = false;
      updateInlineMsg("⚠️ 目前為離線狀態！點擊寫入可直接覆寫本機 PPT 檔案以供大螢幕投影。", "offline");
      showStatus("網路離線中：點擊修改並寫入將直接覆寫本機 PPT 檔案！", false);
    }
  }

  function submitAuthAndRead() {
    const modalPwd = document.getElementById("modalPwdInput").value.trim();
    if (!modalPwd) return alert("請輸入密碼！");
    
    document.getElementById("pwd").value = modalPwd;
    document.getElementById("authModal").style.display = "none";
    executeRead(false);
  }

  /* 讀取演講者備忘錄與簡報表格 */
  async function executeRead(isSilent = false) {
    const rawPwd = document.getElementById("pwd").value.trim();
    const date = document.getElementById("targetDate").value;

    if (!rawPwd) {
      if (!isSilent) document.getElementById("authModal").style.display = "flex";
      return;
    }

    if (!isSilent) showStatus("正在連線讀取雲端整日內容...", false);

    try {
      const hashedPwd = await hashPassword(rawPwd);
      const res = await sendJsonpRequest("read", {
        password: rawPwd,
        hashedPassword: hashedPwd,
        date: date
      });

      if (res && res.data) {
        document.getElementById("formalExam").value = res.data.exam || "";
        document.getElementById("formalHomework").value = res.data.homework || "";
        document.getElementById("formalNote").value = res.data.note || "";
        document.getElementById("formalSpeakerNotes").value = res.data.speakerNotes || "";
        setActiveChips("formalScoreChips", res.data.scoreSubjects || []);

        hasReadCurrentDate = true;
        showStatus(`已精準載入 [${date}] 雲端簡報內容 (含演講者備忘錄)！`, false);
        updateInlineMsg(`✅ 已同步最新雲端內容`, "active");
      }
    } catch (err) {
      hasReadCurrentDate = false;
      showStatus(`讀取失敗: ${err.message}`, true);
    }
  }

  function manualTriggerRead() {
    executeRead(false);
  }

  async function handleWrite() {
    await performUnifiedUpload(false);
  }

  /* 雙軌同步核心流程 */
  async function performUnifiedUpload(isAuto = false) {
    const rawPwd = document.getElementById("pwd").value.trim();
    const date = document.getElementById("targetDate").value;

    let exam = document.getElementById("formalExam").value.trim();
    let homework = document.getElementById("formalHomework").value.trim();
    let note = document.getElementById("formalNote").value.trim();
    let speakerNotes = document.getElementById("formalSpeakerNotes").value.trim();
    let activeScores = getActiveChips("formalScoreChips");

    if (!exam && !homework && !note && !speakerNotes && activeScores.length === 0) {
      exam = document.getElementById("draftExam").value.trim();
      homework = document.getElementById("draftHomework").value.trim();
      note = document.getElementById("draftNote").value.trim();
      speakerNotes = document.getElementById("draftSpeakerNotes").value.trim();
      activeScores = getActiveChips("draftScoreChips");
    }

    if (!exam && !homework && !note && !speakerNotes && activeScores.length === 0) return;

    const currentDataHash = `${date}|${exam}|${homework}|${note}|${speakerNotes}|${activeScores.join(',')}`;
    if (currentDataHash === lastSyncedDataHash && isAuto) return;

    const payload = {
      date: date,
      exam: exam,
      homework: homework,
      note: note,
      speakerNotes: speakerNotes,
      scoreSubjects: activeScores
    };

    // 1. 優先寫入本地 PPTX 檔案
    let localOk = await writeToLocalPptxFile(payload);

    // 2. 斷網狀態防護
    if (!navigator.onLine) {
      lastSyncedDataHash = currentDataHash;
      const statusText = localOk 
        ? `⚡ [離線模式] 內容已即刻覆寫本機 PPT 檔案！大螢幕可立即開啟投影。`
        : `⚡ [離線模式] 內容已保存於草稿區 (尚未連結本機檔案)。`;
      showStatus(statusText, false);
      updateInlineMsg(`⚠️ 離線狀態：本機 PPT 已就緒，復網後將自動同步雲端。`, "offline");
      return;
    }

    // 3. 連線狀態寫入雲端
    if (!rawPwd) {
      if (!isAuto) showStatus("本機已更新，但請輸入密碼以同步至雲端簡報！", true);
      return;
    }

    try {
      const hashedPwd = await hashPassword(rawPwd);
      await sendJsonpRequest("write", {
        password: rawPwd,
        hashedPassword: hashedPwd,
        date: date,
        exam: exam,
        homework: homework,
        note: note,
        speakerNotes: speakerNotes,
        scoreSubjects: activeScores.join(',')
      });

      lastSyncedDataHash = currentDataHash;
      const nowStr = new Date().toLocaleTimeString();
      const localMsg = localOk ? "本機 PPT 覆寫成功 ＆ " : "";
      showStatus(`[雙軌同步完成] ${localMsg}雲端 Slides 已上傳 (${nowStr})！`, false);
      updateInlineMsg(`✅ 已於 ${nowStr} 成功同步本地與雲端簡報！`, "active");
    } catch (err) {
      console.warn("同步失敗或處於斷網區間：", err.message);
      updateInlineMsg(`⚠️ 本地已更新，雲端同步暫緩 (${err.message})`, "offline");
    }
  }

  function initDatePicker() {
    const dateInput = document.getElementById("targetDate");
    dateInput.value = new Date().toISOString().split('T')[0];
  }

  function shiftDate(offset) {
    const dateInput = document.getElementById("targetDate");
    const currentDate = new Date(dateInput.value || new Date());
    currentDate.setDate(currentDate.getDate() + offset);
    dateInput.value = currentDate.toISOString().split('T')[0];
    onDateChange();
  }

  function onDateChange() {
    loadDraftForCurrentDate();
    hasReadCurrentDate = false;

    document.getElementById("formalExam").value = "";
    document.getElementById("formalHomework").value = "";
    document.getElementById("formalNote").value = "";
    document.getElementById("formalSpeakerNotes").value = "";
    setActiveChips("formalScoreChips", []);

    clearTimeout(dateChangeDebounceTimer);
    dateChangeDebounceTimer = setTimeout(() => {
      const pwd = document.getElementById("pwd").value.trim();
      if (pwd) {
        executeRead(true);
      } else {
        checkNetworkProbe();
      }
    }, 350);
  }

  function toggleChip(el) { el.classList.toggle("active"); }
  function toggleDraftChip(el) { el.classList.toggle("active"); autoSaveDraft(); }

  function getActiveChips(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return [];
    return Array.from(container.querySelectorAll(".chip.active")).map(node => node.getAttribute("data-sub"));
  }

  function setActiveChips(containerId, subjectList) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.querySelectorAll(".chip").forEach(chip => {
      const sub = chip.getAttribute("data-sub");
      if (subjectList && subjectList.includes(sub)) {
        chip.classList.add("active");
      } else {
        chip.classList.remove("active");
      }
    });
  }

  function getDraftKey() {
    return `contact_daily_draft_${document.getElementById("targetDate").value}`;
  }

  function autoSaveDraft() {
    const key = getDraftKey();
    const draftData = {
      exam: document.getElementById("draftExam").value,
      homework: document.getElementById("draftHomework").value,
      note: document.getElementById("draftNote").value,
      speakerNotes: document.getElementById("draftSpeakerNotes").value,
      scoreSubjects: getActiveChips("draftScoreChips"),
      timestamp: new Date().toLocaleTimeString()
    };
    localStorage.setItem(key, JSON.stringify(draftData));
    updateDraftNotice(true, draftData.timestamp);
  }

  function loadDraftForCurrentDate() {
    const key = getDraftKey();
    const saved = localStorage.getItem(key);
    if (saved) {
      try {
        const draftData = JSON.parse(saved);
        document.getElementById("draftExam").value = draftData.exam || "";
        document.getElementById("draftHomework").value = draftData.homework || "";
        document.getElementById("draftNote").value = draftData.note || "";
        document.getElementById("draftSpeakerNotes").value = draftData.speakerNotes || "";
        setActiveChips("draftScoreChips", draftData.scoreSubjects || []);
        updateDraftNotice(true, draftData.timestamp);
      } catch (e) {
        updateDraftNotice(false);
      }
    } else {
      document.getElementById("draftExam").value = "";
      document.getElementById("draftHomework").value = "";
      document.getElementById("draftNote").value = "";
      document.getElementById("draftSpeakerNotes").value = "";
      setActiveChips("draftScoreChips", []);
      updateDraftNotice(false);
    }
  }

  function smartMergeText(existingVal, newVal) {
    existingVal = (existingVal || "").trim();
    newVal = (newVal || "").trim();
    if (!existingVal) return newVal;
    if (!newVal) return existingVal;
    if (existingVal === newVal || existingVal.includes(newVal)) return existingVal;
    return `${existingVal}\n${newVal}`;
  }

  function copyDraftToFormal() {
    const draftExam = document.getElementById("draftExam").value;
    const draftHomework = document.getElementById("draftHomework").value;
    const draftNote = document.getElementById("draftNote").value;
    const draftSpeakerNotes = document.getElementById("draftSpeakerNotes").value;
    const draftScores = getActiveChips("draftScoreChips");

    if (!draftExam && !draftHomework && !draftNote && !draftSpeakerNotes && draftScores.length === 0) {
      showStatus("草稿區無資料可複製！", true);
      return;
    }

    document.getElementById("formalExam").value = smartMergeText(document.getElementById("formalExam").value, draftExam);
    document.getElementById("formalHomework").value = smartMergeText(document.getElementById("formalHomework").value, draftHomework);
    document.getElementById("formalNote").value = smartMergeText(document.getElementById("formalNote").value, draftNote);
    document.getElementById("formalSpeakerNotes").value = smartMergeText(document.getElementById("formalSpeakerNotes").value, draftSpeakerNotes);

    const formalScores = new Set([...getActiveChips("formalScoreChips"), ...draftScores]);
    setActiveChips("formalScoreChips", Array.from(formalScores));

    showStatus("已將草稿內容同步至正式區！", false);
  }

  function clearDraftForCurrentDate() {
    if (confirm("確定清除本日暫存草稿？")) {
      localStorage.removeItem(getDraftKey());
      document.getElementById("draftExam").value = "";
      document.getElementById("draftHomework").value = "";
      document.getElementById("draftNote").value = "";
      document.getElementById("draftSpeakerNotes").value = "";
      setActiveChips("draftScoreChips", []);
      updateDraftNotice(false);
      showStatus("已清除本機草稿。", false);
    }
  }

  function updateDraftNotice(hasDraft, timeStr = "") {
    const notice = document.getElementById("draftNotice");
    if (!notice) return;
    if (hasDraft) {
      notice.innerText = `(暫存於 ${timeStr}，自動排程監控中)`;
      notice.style.color = "#198754";
    } else {
      notice.innerText = "(目前無草稿)";
      notice.style.color = "#6c757d";
    }
  }

  function calculateNextTargetTime() {
    const now = new Date();
    const target = new Date(now);
    target.setSeconds(0, 0);

    if (now.getMinutes() < targetMinute) {
      target.setMinutes(targetMinute);
    } else {
      target.setHours(target.getHours() + 1);
      target.setMinutes(targetMinute);
    }

    nextTargetSyncTimestamp = target.getTime();
    updateCountdownUI();
    return nextTargetSyncTimestamp;
  }

  function onSyncMinuteChanged() {
    const input = document.getElementById("syncMinuteInput");
    let val = parseInt(input.value, 10);
    if (isNaN(val) || val < 0) val = 0;
    if (val > 59) val = 59;
    input.value = val;
    targetMinute = val;
    localStorage.setItem("contact_sync_minute", targetMinute);

    calculateNextTargetTime();
    showStatus(`已更新排程設定：每小時第 ${targetMinute} 分鐘自動上傳。`, false);
  }

  async function checkAndTriggerSync() {
    updateCountdownUI();
    const now = Date.now();
    if (now >= nextTargetSyncTimestamp) {
      await performUnifiedUpload(true);
      calculateNextTargetTime();
    }
  }

  function startBackgroundWorker() {
    const workerScript = `
      setInterval(() => { postMessage('TICK_1_SEC'); }, 1000);
    `;
    const blob = new Blob([workerScript], { type: "application/javascript" });
    bgWorker = new Worker(URL.createObjectURL(blob));

    bgWorker.onmessage = function(e) {
      if (e.data === 'TICK_1_SEC') {
        checkAndTriggerSync();
      }
    };
  }

  window.addEventListener("DOMContentLoaded", () => {
    initDatePicker();
    loadDraftForCurrentDate();

    const savedMinute = localStorage.getItem("contact_sync_minute");
    if (savedMinute !== null) {
      targetMinute = parseInt(savedMinute, 10);
      document.getElementById("syncMinuteInput").value = targetMinute;
    }

    calculateNextTargetTime();

    try {
      startBackgroundWorker();
    } catch (e) {
      setInterval(checkAndTriggerSync, 1000);
    }

    // 啟動時自動檢查 IndexedDB 還原檔案
    autoRestoreLocalFile();

    // 啟動連線檢驗
    checkNetworkProbe();

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        checkAndTriggerSync();
      }
    });

    window.addEventListener('online', () => {
      showStatus("🌐 網路恢復連線！自動補傳寫入雲端 Slides...", false);
      performUnifiedUpload(true);
    });
  });
</script>
