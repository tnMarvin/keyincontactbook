<!--
  功能說明：電子聯絡簿系統 - 啟動連線探針 + 安全先讀後寫工作流 + 離線提示與草稿保護 + 自訂排程
  代碼產生日期與時間：2026-10-06 20:20
-->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子聯絡簿寫入系統</title>
  <script>
    if (window.top !== window.self) {
      try {
        window.top.location.href = window.location.href;
      } catch (e) {
        console.warn("無法跳脫 iframe，維持當前視窗模式");
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.warn('Service Worker 註冊略過：', err));
      });
    }
  </script>
  <style>
    :root {
      --primary-green: #0f5132;
      --btn-green: #198754;
      --btn-green-hover: #146c43;
      --btn-dark: #212529;
      --btn-dark-hover: #1c1f23;
      --btn-warning: #ffc107;
      --btn-danger: #dc3545;
      --btn-secondary: #6c757d;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --border-color: #dee2e6;
      --draft-border: #dc3545;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px;
    }

    h2 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    input[type="password"],
    input[type="date"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      background-color: #fff;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #86b7fe;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }

    .date-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .date-row input[type="date"] {
      flex: 1;
      cursor: pointer;
    }

    /* 頂部排程與狀態指示條 */
    .schedule-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #e7f1ff;
      border: 1px solid #b6d4fe;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      color: #084298;
    }

    .schedule-bar input[type="number"] {
      width: 70px;
      padding: 6px 8px;
      font-size: 0.95rem;
      text-align: center;
    }

    /* 內嵌訊息框 */
    .inline-msg-box {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 18px;
      background-color: #f8f9fa;
      border: 1px solid #ced4da;
      color: #495057;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s;
    }
    .inline-msg-box.offline {
      background-color: #fff3cd;
      border-color: #ffecb5;
      color: #664d03;
      font-weight: 600;
    }
    .inline-msg-box.active {
      background-color: #e8f5e9;
      border-color: #a5d6a7;
      color: #1b5e20;
    }

    .chip-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .chip {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #ced4da;
      background-color: #fff;
      color: #495057;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .chip.active {
      background-color: var(--btn-green);
      border-color: var(--btn-green);
      color: #fff;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn:active { transform: scale(0.99); }
    .btn:disabled {
      background-color: #adb5bd !important;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .btn-submit { background-color: var(--btn-green); }
    .btn-submit:hover { background-color: var(--btn-green-hover); }
    .btn-preview { background-color: var(--btn-dark); }
    .btn-preview:hover { background-color: var(--btn-dark-hover); }

    .btn-sm {
      width: auto;
      padding: 8px 12px;
      font-size: 0.85rem;
      margin-bottom: 0;
    }
    .btn-warning { background-color: var(--btn-warning); color: #000; }
    .btn-danger { background-color: var(--btn-danger); }
    .btn-secondary { background-color: var(--btn-secondary); }

    .status-box {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-top: 12px;
      display: block;
      line-height: 1.4;
      background-color: #e9ecef;
      color: #495057;
      border: 1px solid #ced4da;
    }

    .draft-section {
      margin-top: 28px;
      border: 2px dashed var(--draft-border);
      border-radius: var(--radius);
      padding: 18px;
      background-color: #fff8f8;
    }

    .draft-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .draft-title {
      font-weight: 700;
      color: #b02a37;
    }

    .draft-status { font-size: 0.825rem; color: #6c757d; }

    .action-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    /* 安全驗證模態視窗 (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 16px;
    }
    .modal-card {
      background: #fff;
      padding: 24px;
      border-radius: var(--radius);
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 520px) {
      .grid-2col { grid-template-columns: 1fr; }
      .schedule-bar { flex-direction: column; align-items: flex-start; }
      .action-row { flex-direction: column; }
      .action-row .btn-sm { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📝 電子聯絡簿寫入系統</h2>
  
  <div class="form-group">
    <label for="pwd">🔑 授權密碼：</label>
    <input type="password" id="pwd" placeholder="請先驗證密碼以解鎖寫入權限...">
  </div>

  <div class="form-group">
    <label for="targetDate">📅 選擇同步日期：</label>
    <div class="date-row">
      <button class="btn btn-sm btn-secondary" onclick="shiftDate(-1)">◀ 前一天</button>
      <input type="date" id="targetDate" onchange="onDateChange()">
      <button class="btn btn-sm btn-secondary" onclick="shiftDate(1)">後一天 ▶</button>
    </div>
  </div>

  <!-- 自訂排程列 -->
  <div class="schedule-bar">
    <span>⏱️ 自動背景同步：每小時第</span>
    <input type="number" id="syncMinuteInput" min="0" max="59" value="30" onchange="onSyncMinuteChanged()">
    <span>分整自動上傳</span>
  </div>

  <!-- 內嵌訊息框 -->
  <div id="inlineMsgBox" class="inline-msg-box">
    <span id="inlineMsgContent">🔍 正在偵測校園網路連線狀態...</span>
    <span id="countdownBadge" style="font-weight: 700; font-family: monospace;">--:--</span>
  </div>

  <!-- 上方：成績科目標籤 -->
  <div class="form-group">
    <label>📊 今日有成績科目：</label>
    <div class="chip-container" id="formalScoreChips">
      <div class="chip" data-sub="國文" onclick="toggleChip(this)">國文</div>
      <div class="chip" data-sub="英語" onclick="toggleChip(this)">英語</div>
      <div class="chip" data-sub="數學" onclick="toggleChip(this)">數學</div>
      <div class="chip" data-sub="自然" onclick="toggleChip(this)">自然</div>
      <div class="chip" data-sub="歷史" onclick="toggleChip(this)">歷史</div>
      <div class="chip" data-sub="地理" onclick="toggleChip(this)">地理</div>
      <div class="chip" data-sub="公民" onclick="toggleChip(this)">公民</div>
    </div>
  </div>

  <!-- 中段：正式區 (預設鎖定，需讀取完成才解鎖) -->
  <div class="grid-2col form-group">
    <div>
      <label for="formalExam">📌 正式考試內容：</label>
      <textarea id="formalExam" rows="7" placeholder="連線驗證後將自動帶入雲端現有內容..."></textarea>
    </div>
    <div>
      <label for="formalHomework">✍️ 正式作業內容：</label>
      <textarea id="formalHomework" rows="7" placeholder="連線驗證後將自動帶入雲端現有內容..."></textarea>
    </div>
  </div>

  <!-- 下方：全寬 備/嘉 欄位 -->
  <div class="form-group">
    <label for="formalNote">📝 備註 / 嘉言錄（底端橫跨）：</label>
    <textarea id="formalNote" rows="2" placeholder="連線驗證後將自動帶入雲端現有內容..."></textarea>
  </div>

  <button class="btn btn-preview" onclick="manualTriggerRead()">☁️ 讀取雲端投影片內容</button> 
  
  <!-- 核心安全防護：未成功讀取前禁用寫入按鈕 -->
  <button id="btnWrite" class="btn btn-submit" onclick="handleWrite()" disabled title="請先驗證並讀取雲端內容以避免盲寫覆蓋">
    💾 修改並寫入雲端簡報 (未讀取鎖定中)
  </button>

  <div id="statusBox" class="status-box">初始化中...</div>

  <!-- 離線草稿區塊 (鏡像配置) -->
  <div class="draft-section">
    <div class="draft-header">
      <div class="draft-title">💾 本機離線草稿暫存區</div>
      <div class="draft-status" id="draftNotice">(目前無草稿)</div>
    </div>

    <div class="form-group" style="margin-bottom:12px;">
      <label>📊 暫存：有成績科目：</label>
      <div class="chip-container" id="draftScoreChips">
        <div class="chip" data-sub="國文" onclick="toggleDraftChip(this)">國文</div>
        <div class="chip" data-sub="英語" onclick="toggleDraftChip(this)">英語</div>
        <div class="chip" data-sub="數學" onclick="toggleDraftChip(this)">數學</div>
        <div class="chip" data-sub="自然" onclick="toggleDraftChip(this)">自然</div>
        <div class="chip" data-sub="歷史" onclick="toggleDraftChip(this)">歷史</div>
        <div class="chip" data-sub="地理" onclick="toggleDraftChip(this)">地理</div>
        <div class="chip" data-sub="公民" onclick="toggleDraftChip(this)">公民</div>
      </div>
    </div>

    <div class="grid-2col form-group" style="margin-bottom:12px;">
      <div>
        <label for="draftExam">📌 暫存考試：</label>
        <textarea id="draftExam" rows="4" placeholder="離線時在此輸入考試草稿..." oninput="autoSaveDraft()"></textarea>
      </div>
      <div>
        <label for="draftHomework">✍️ 暫存作業：</label>
        <textarea id="draftHomework" rows="4" placeholder="離線時在此輸入作業草稿..." oninput="autoSaveDraft()"></textarea>
      </div>
    </div>

    <div class="form-group" style="margin-bottom:12px;">
      <label for="draftNote">📝 暫存備註 / 嘉言錄：</label>
      <textarea id="draftNote" rows="2" placeholder="離線時在此輸入備註草稿..." oninput="autoSaveDraft()"></textarea>
    </div>

    <div class="action-row">
      <button class="btn btn-sm btn-warning" onclick="copyDraftToFormal()">⚡ 一鍵複製草稿到正式區</button>
      <button class="btn btn-sm btn-secondary" onclick="loadDraftForCurrentDate()">🔄 載入草稿</button>
      <button class="btn btn-sm btn-danger" onclick="clearDraftForCurrentDate()">🗑️ 清除草稿</button>
    </div>
  </div>
</div>

<!-- 安全認證對話框 (Modal) -->
<div id="authModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-title">🔐 網路連線正常，請驗證身分</div>
    <p style="font-size: 0.9rem; color: #6c757d; margin-bottom: 16px;">
      系統已偵測到連線通暢。為防止誤寫覆蓋，請輸入授權密碼以自動帶入雲端簡報內容：
    </p>
    <input type="password" id="modalPwdInput" placeholder="請輸入授權密碼..." style="margin-bottom: 16px;">
    <button class="btn btn-submit" onclick="submitAuthAndRead()">確認並自動載入雲端內容</button>
  </div>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxm7i2Zh80lsjZp5Mf3TkyeEQvurZEcEqHhEdDrbNU7eNbRyalwubozpI5Ed7wcm-XpTg/exec";

  let targetMinute = 30;
  let nextTargetSyncTimestamp = 0;
  let lastSyncedDataHash = "";
  let hasReadCurrentDate = false; // 是否已完成讀取雲端內容之標記
  let isOnlineState = false;
  let bgWorker = null;
  let dateChangeDebounceTimer = null;

  window.onerror = function(msg, url, line) {
    showStatus(`執行異常 (行號 ${line}): ${msg}`, true);
    return false;
  };

  async function hashPassword(plainText) {
    if (!plainText) return "";
    const encoder = new TextEncoder();
    const data = encoder.encode(plainText);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function sendJsonpRequest(action, dataParams = {}) {
    return new Promise((resolve, reject) => {
      const callbackName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      const script = document.createElement('script');
      script.crossOrigin = "anonymous";

      const queryParams = new URLSearchParams({
        action: action,
        callback: callbackName,
        _ts: Date.now(),
        ...dataParams
      });

      const timer = setTimeout(() => {
        cleanup();
        reject(new Error("連線逾時 (8秒)：可能處於校園 10 分鐘斷網期間。"));
      }, 8000);

      function cleanup() {
        clearTimeout(timer);
        if (window[callbackName]) delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[callbackName] = (response) => {
        cleanup();
        if (response && response.status === "error") {
          reject(new Error(response.message || "處理錯誤"));
        } else {
          resolve(response);
        }
      };

      script.onerror = () => {
        cleanup();
        reject(new Error("網路請求失敗，請確認連線。"));
      };

      script.src = `${GAS_WEB_APP_URL}?${queryParams.toString()}`;
      document.body.appendChild(script);
    });
  }

  function showStatus(msg, isError = false) {
    const box = document.getElementById("statusBox");
    if (!box) return;
    box.style.display = "block";
    box.style.backgroundColor = isError ? "#f8d7da" : "#d1e7dd";
    box.style.color = isError ? "#842029" : "#0f5132";
    box.style.border = isError ? "1px solid #f5c2c7" : "1px solid #badbcc";
    box.innerHTML = (isError ? "❌ " : "✅ ") + msg;
  }

  function updateInlineMsg(text, type = "normal") {
    const box = document.getElementById("inlineMsgBox");
    const content = document.getElementById("inlineMsgContent");
    if (!box || !content) return;

    content.innerText = text;
    box.classList.remove("offline", "active");
    if (type === "offline") box.classList.add("offline");
    if (type === "active") box.classList.add("active");
  }

  function updateCountdownUI() {
    const badge = document.getElementById("countdownBadge");
    if (!badge || nextTargetSyncTimestamp === 0) return;

    const diff = nextTargetSyncTimestamp - Date.now();
    if (diff <= 0) {
      badge.innerText = "00:00 (觸發中)";
      return;
    }
    const totalSeconds = Math.floor(diff / 1000);
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    badge.innerText = `倒數 ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function setWriteButtonState(enabled) {
    const btn = document.getElementById("btnWrite");
    if (!btn) return;
    btn.disabled = !enabled;
    if (enabled) {
      btn.innerText = "💾 修改並寫入雲端簡報";
      btn.title = "已完成雲端讀取核對，可安全寫入";
    } else {
      btn.innerText = "💾 修改並寫入雲端簡報 (未讀取鎖定中)";
      btn.title = "請先驗證並讀取雲端內容以避免盲寫覆蓋";
    }
  }

  /* 核心：連線探針 (Ping) */
  async function checkNetworkProbe() {
    updateInlineMsg("🔍 正在嘗試連線雲端服務...", "normal");
    try {
      await sendJsonpRequest("ping");
      isOnlineState = true;
      updateInlineMsg(`🌐 連線正常！請驗證身分載入簡報。`, "normal");
      
      const pwd = document.getElementById("pwd").value.trim();
      if (!pwd) {
        // 連線成功且尚未有密碼，彈出 Modal 提示
        document.getElementById("authModal").style.display = "flex";
        document.getElementById("modalPwdInput").focus();
      } else {
        // 已有密碼，自動讀取
        executeRead(false);
      }
    } catch (e) {
      isOnlineState = false;
      setWriteButtonState(false);
      updateInlineMsg("⚠️ 目前為離線狀態 (無法讀取雲端)。請在下方【草稿暫存區】輸入內容。", "offline");
      showStatus("網路離線中，已保護既有畫面，請直接使用暫存區作業。", false);
    }
  }

  function submitAuthAndRead() {
    const modalPwd = document.getElementById("modalPwdInput").value.trim();
    if (!modalPwd) return alert("請輸入密碼！");
    
    document.getElementById("pwd").value = modalPwd;
    document.getElementById("authModal").style.display = "none";
    executeRead(false);
  }

  /* 核心：執行讀取作業 */
  async function executeRead(isSilent = false) {
    const rawPwd = document.getElementById("pwd").value.trim();
    const date = document.getElementById("targetDate").value;

    if (!rawPwd) {
      if (!isSilent) document.getElementById("authModal").style.display = "flex";
      return;
    }

    if (!isSilent) showStatus("正在連線讀取雲端整日內容...", false);

    try {
      const hashedPwd = await hashPassword(rawPwd);
      const res = await sendJsonpRequest("read", {
        password: rawPwd,
        hashedPassword: hashedPwd,
        date: date
      });

      if (res && res.data) {
        document.getElementById("formalExam").value = res.data.exam || "";
        document.getElementById("formalHomework").value = res.data.homework || "";
        document.getElementById("formalNote").value = res.data.note || "";
        setActiveChips("formalScoreChips", res.data.scoreSubjects || []);

        hasReadCurrentDate = true;
        setWriteButtonState(true); // 解鎖寫入按鈕
        showStatus(`已精準載入 [${date}] 雲端簡報內容！`, false);
        updateInlineMsg(`✅ 已同步最新雲端內容 (解鎖寫入權限)`, "active");
      }
    } catch (err) {
      hasReadCurrentDate = false;
      setWriteButtonState(false);
      showStatus(`讀取失敗: ${err.message}`, true);
    }
  }

  function manualTriggerRead() {
    executeRead(false);
  }

  /* 核心：執行寫入作業 */
  async function handleWrite() {
    if (!hasReadCurrentDate) {
      showStatus("為避免覆蓋未確認內容，請先點擊讀取雲端投影片！", true);
      return;
    }
    await performUpload(false);
  }

  async function performUpload(isAuto = false) {
    if (!navigator.onLine) {
      updateInlineMsg(`⚠️ 目前處於網路斷線狀態，稍後自動重試...`, "offline");
      return;
    }

    const rawPwd = document.getElementById("pwd").value.trim();
    const date = document.getElementById("targetDate").value;

    if (!rawPwd) {
      if (!isAuto) showStatus("請先輸入授權密碼！", true);
      return;
    }

    let exam = document.getElementById("formalExam").value.trim();
    let homework = document.getElementById("formalHomework").value.trim();
    let note = document.getElementById("formalNote").value.trim();
    let activeScores = getActiveChips("formalScoreChips").join(",");

    if (!exam && !homework && !note && !activeScores) {
      exam = document.getElementById("draftExam").value.trim();
      homework = document.getElementById("draftHomework").value.trim();
      note = document.getElementById("draftNote").value.trim();
      activeScores = getActiveChips("draftScoreChips").join(",");
    }

    if (!exam && !homework && !note && !activeScores) return;

    const currentDataHash = `${date}|${exam}|${homework}|${note}|${activeScores}`;
    if (currentDataHash === lastSyncedDataHash && isAuto) return;

    try {
      const hashedPwd = await hashPassword(rawPwd);
      await sendJsonpRequest("write", {
        password: rawPwd,
        hashedPassword: hashedPwd,
        date: date,
        exam: exam,
        homework: homework,
        note: note,
        scoreSubjects: activeScores
      });

      lastSyncedDataHash = currentDataHash;
      const nowStr = new Date().toLocaleTimeString();
      showStatus(`[同步完成] 內容已上傳雲端 (${nowStr})！`, false);
      updateInlineMsg(`✅ 已於 ${nowStr} 成功自動同步簡報！`, "active");
    } catch (err) {
      console.warn("同步失敗或處於斷網區間：", err.message);
      updateInlineMsg(`⚠️ 同步暫緩 (${err.message})`, "offline");
    }
  }

  function initDatePicker() {
    const dateInput = document.getElementById("targetDate");
    dateInput.value = new Date().toISOString().split('T')[0];
  }

  function shiftDate(offset) {
    const dateInput = document.getElementById("targetDate");
    const currentDate = new Date(dateInput.value || new Date());
    currentDate.setDate(currentDate.getDate() + offset);
    dateInput.value = currentDate.toISOString().split('T')[0];
    onDateChange();
  }

  function onDateChange() {
    loadDraftForCurrentDate();
    hasReadCurrentDate = false;
    setWriteButtonState(false); // 切換日期後重新鎖定寫入，防盲寫

    // 清空正式區，避免殘留前一天的文字
    document.getElementById("formalExam").value = "";
    document.getElementById("formalHomework").value = "";
    document.getElementById("formalNote").value = "";
    setActiveChips("formalScoreChips", []);

    clearTimeout(dateChangeDebounceTimer);
    dateChangeDebounceTimer = setTimeout(() => {
      const pwd = document.getElementById("pwd").value.trim();
      if (pwd) {
        executeRead(true);
      } else {
        checkNetworkProbe();
      }
    }, 350);
  }

  function toggleChip(el) {
    el.classList.toggle("active");
  }

  function toggleDraftChip(el) {
    el.classList.toggle("active");
    autoSaveDraft();
  }

  function getActiveChips(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return [];
    return Array.from(container.querySelectorAll(".chip.active")).map(node => node.getAttribute("data-sub"));
  }

  function setActiveChips(containerId, subjectList) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.querySelectorAll(".chip").forEach(chip => {
      const sub = chip.getAttribute("data-sub");
      if (subjectList && subjectList.includes(sub)) {
        chip.classList.add("active");
      } else {
        chip.classList.remove("active");
      }
    });
  }

  function getDraftKey() {
    return `contact_daily_draft_${document.getElementById("targetDate").value}`;
  }

  function autoSaveDraft() {
    const key = getDraftKey();
    const draftData = {
      exam: document.getElementById("draftExam").value,
      homework: document.getElementById("draftHomework").value,
      note: document.getElementById("draftNote").value,
      scoreSubjects: getActiveChips("draftScoreChips"),
      timestamp: new Date().toLocaleTimeString()
    };
    localStorage.setItem(key, JSON.stringify(draftData));
    updateDraftNotice(true, draftData.timestamp);
  }

  function loadDraftForCurrentDate() {
    const key = getDraftKey();
    const saved = localStorage.getItem(key);
    if (saved) {
      try {
        const draftData = JSON.parse(saved);
        document.getElementById("draftExam").value = draftData.exam || "";
        document.getElementById("draftHomework").value = draftData.homework || "";
        document.getElementById("draftNote").value = draftData.note || "";
        setActiveChips("draftScoreChips", draftData.scoreSubjects || []);
        updateDraftNotice(true, draftData.timestamp);
      } catch (e) {
        updateDraftNotice(false);
      }
    } else {
      document.getElementById("draftExam").value = "";
      document.getElementById("draftHomework").value = "";
      document.getElementById("draftNote").value = "";
      setActiveChips("draftScoreChips", []);
      updateDraftNotice(false);
    }
  }

  function smartMergeText(existingVal, newVal) {
    existingVal = (existingVal || "").trim();
    newVal = (newVal || "").trim();
    if (!existingVal) return newVal;
    if (!newVal) return existingVal;
    if (existingVal === newVal || existingVal.includes(newVal)) return existingVal;
    return `${existingVal}\n${newVal}`;
  }

  function copyDraftToFormal() {
    const draftExam = document.getElementById("draftExam").value;
    const draftHomework = document.getElementById("draftHomework").value;
    const draftNote = document.getElementById("draftNote").value;
    const draftScores = getActiveChips("draftScoreChips");

    if (!draftExam && !draftHomework && !draftNote && draftScores.length === 0) {
      showStatus("草稿區無資料可複製！", true);
      return;
    }

    document.getElementById("formalExam").value = smartMergeText(document.getElementById("formalExam").value, draftExam);
    document.getElementById("formalHomework").value = smartMergeText(document.getElementById("formalHomework").value, draftHomework);
    document.getElementById("formalNote").value = smartMergeText(document.getElementById("formalNote").value, draftNote);

    const formalScores = new Set([...getActiveChips("formalScoreChips"), ...draftScores]);
    setActiveChips("formalScoreChips", Array.from(formalScores));

    showStatus("已將草稿內容同步至正式區！", false);
  }

  function clearDraftForCurrentDate() {
    if (confirm("確定清除本日暫存草稿？")) {
      localStorage.removeItem(getDraftKey());
      document.getElementById("draftExam").value = "";
      document.getElementById("draftHomework").value = "";
      document.getElementById("draftNote").value = "";
      setActiveChips("draftScoreChips", []);
      updateDraftNotice(false);
      showStatus("已清除本機草稿。", false);
    }
  }

  function updateDraftNotice(hasDraft, timeStr = "") {
    const notice = document.getElementById("draftNotice");
    if (!notice) return;
    if (hasDraft) {
      notice.innerText = `(暫存於 ${timeStr}，自動排程監控中)`;
      notice.style.color = "#198754";
    } else {
      notice.innerText = "(目前無草稿)";
      notice.style.color = "#6c757d";
    }
  }

  function calculateNextTargetTime() {
    const now = new Date();
    const target = new Date(now);
    target.setSeconds(0, 0);

    if (now.getMinutes() < targetMinute) {
      target.setMinutes(targetMinute);
    } else {
      target.setHours(targetTarget => target.getHours() + 1);
      target.setMinutes(targetMinute);
    }

    nextTargetSyncTimestamp = target.getTime();
    updateCountdownUI();
    return nextTargetSyncTimestamp;
  }

  function onSyncMinuteChanged() {
    const input = document.getElementById("syncMinuteInput");
    let val = parseInt(input.value, 10);
    if (isNaN(val) || val < 0) val = 0;
    if (val > 59) val = 59;
    input.value = val;
    targetMinute = val;
    localStorage.setItem("contact_sync_minute", targetMinute);

    calculateNextTargetTime();
    showStatus(`已更新排程設定：每小時第 ${targetMinute} 分鐘自動上傳。`, false);
  }

  async function checkAndTriggerSync() {
    updateCountdownUI();
    const now = Date.now();
    if (now >= nextTargetSyncTimestamp) {
      await performUpload(true);
      calculateNextTargetTime();
    }
  }

  function startBackgroundWorker() {
    const workerScript = `
      setInterval(() => { postMessage('TICK_1_SEC'); }, 1000);
    `;
    const blob = new Blob([workerScript], { type: "application/javascript" });
    bgWorker = new Worker(URL.createObjectURL(blob));

    bgWorker.onmessage = function(e) {
      if (e.data === 'TICK_1_SEC') {
        checkAndTriggerSync();
      }
    };
  }

  window.addEventListener("DOMContentLoaded", () => {
    initDatePicker();
    loadDraftForCurrentDate();

    const savedMinute = localStorage.getItem("contact_sync_minute");
    if (savedMinute !== null) {
      targetMinute = parseInt(savedMinute, 10);
      document.getElementById("syncMinuteInput").value = targetMinute;
    }

    calculateNextTargetTime();

    try {
      startBackgroundWorker();
    } catch (e) {
      setInterval(checkAndTriggerSync, 1000);
    }

    // 啟動即執行：連線探針檢驗
    checkNetworkProbe();

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        checkAndTriggerSync();
      }
    });

    window.addEventListener('online', () => {
      showStatus("網路連線恢復，執行連線探針...", false);
      checkNetworkProbe();
    });
  });
</script>

</body>
