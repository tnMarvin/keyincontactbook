<!--
  * 功能描述：電子聯絡簿寫入系統 - 網頁前端 (整頁全覽版：成績多選按鈕組 + 全寬備嘉獨立框 + PWA 離線支援)
  * 代碼產生日期與時間：2026-10-06 00:55
  * 說明：
  * 1. 廢除科目下拉選單，頂部提供「今日有成績科目」7 科 Chips 多選點擊組。
  * 2. 中段並列考試與作業大框，下方全寬橫跨「備註 / 嘉言錄」。
  * 3. 離線草稿鏡像升級，一鍵暫存與復原整日聯絡簿。
-->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子聯絡簿寫入程式</title>
  
  <script>
    if (window.top !== window.self) {
      try {
        window.top.location.href = window.location.href;
      } catch (e) {
        console.warn("無法自動跳脫 iframe，將以當前視窗持續運作。");
      }
    }

    // 註冊 PWA Service Worker (支援斷線離線開啟介面)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Service Worker 註冊完成，已就緒離線開啟。'))
          .catch(err => console.warn('Service Worker 註冊失敗：', err));
      });
    }
  </script>

  <style>
    :root {
      --primary-green: #0f5132;
      --btn-green: #198754;
      --btn-green-hover: #146c43;
      --btn-dark: #212529;
      --btn-dark-hover: #1c1f23;
      --btn-warning: #ffc107;
      --btn-warning-hover: #ffca2c;
      --btn-danger: #dc3545;
      --btn-danger-hover: #bb2d3b;
      --btn-secondary: #6c757d;
      --btn-secondary-hover: #5c636a;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --border-color: #dee2e6;
      --draft-border: #dc3545;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px;
    }

    h2 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    input[type="password"],
    input[type="text"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      background-color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #86b7fe;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }

    .date-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .date-row input[type="date"] {
      flex: 1;
      cursor: pointer;
    }

    /* 多選科目標籤 (Chips) */
    .chip-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .chip {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #ced4da;
      background-color: #fff;
      color: #495057;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .chip.active {
      background-color: #198754;
      border-color: #198754;
      color: #fff;
      box-shadow: 0 2px 6px rgba(25, 135, 84, 0.3);
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active { transform: scale(0.99); }
    .btn-submit { background-color: var(--btn-green); }
    .btn-submit:hover { background-color: var(--btn-green-hover); }
    .btn-preview { background-color: var(--btn-dark); }
    .btn-preview:hover { background-color: var(--btn-dark-hover); }

    .btn-sm {
      width: auto;
      padding: 8px 12px;
      font-size: 0.85rem;
      margin-bottom: 0;
    }
    .btn-warning { background-color: var(--btn-warning); color: #000; }
    .btn-warning:hover { background-color: var(--btn-warning-hover); }
    .btn-danger { background-color: var(--btn-danger); }
    .btn-danger:hover { background-color: var(--btn-danger-hover); }
    .btn-secondary { background-color: var(--btn-secondary); }
    .btn-secondary:hover { background-color: var(--btn-secondary-hover); }

    .status-box {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-top: 12px;
      display: none;
      line-height: 1.4;
    }
    .status-success { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
    .status-error { background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }

    /* 離線草稿區塊 */
    .draft-section {
      margin-top: 28px;
      border: 2px dashed var(--draft-border);
      border-radius: var(--radius);
      padding: 18px;
      background-color: #fff8f8;
    }

    .draft-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .draft-title {
      font-weight: 700;
      color: #b02a37;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .draft-status { font-size: 0.825rem; color: #6c757d; }

    .action-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    @media (max-width: 520px) {
      .grid-2col { grid-template-columns: 1fr; }
      .action-row { flex-direction: column; }
      .action-row .btn-sm { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📝 電子聯絡簿寫入程式</h2>
  
  <!-- 1. 驗證密碼 -->
  <div class="form-group">
    <label for="pwd">🔑 請輸入密碼（驗證身份以讀寫）：</label>
    <input type="password" id="pwd" placeholder="請輸入授權密碼...">
  </div>

  <!-- 2. 日期選擇 -->
  <div class="form-group">
    <label for="targetDate">📅 選擇同步日期：</label>
    <div class="date-row">
      <button class="btn btn-sm btn-secondary" onclick="shiftDate(-1)">◀ 前一天</button>
      <input type="date" id="targetDate" onchange="onDateChange()">
      <button class="btn btn-sm btn-secondary" onclick="shiftDate(1)">後一天 ▶</button>
    </div>
  </div>

  <!-- 3. 上方：今日有成績科目多選點選組 -->
  <div class="form-group">
    <label>📊 今日有成績科目（點選以切換）：</label>
    <div class="chip-container" id="formalScoreChips">
      <div class="chip" data-sub="國文" onclick="toggleChip(this)">國文</div>
      <div class="chip" data-sub="英語" onclick="toggleChip(this)">英語</div>
      <div class="chip" data-sub="數學" onclick="toggleChip(this)">數學</div>
      <div class="chip" data-sub="自然" onclick="toggleChip(this)">自然</div>
      <div class="chip" data-sub="歷史" onclick="toggleChip(this)">歷史</div>
      <div class="chip" data-sub="地理" onclick="toggleChip(this)">地理</div>
      <div class="chip" data-sub="公民" onclick="toggleChip(this)">公民</div>
    </div>
  </div>

  <!-- 4. 中段：正式考試與作業內容 -->
  <div class="grid-2col form-group">
    <div>
      <label for="formalExam">📌 正式考試內容：</label>
      <textarea id="formalExam" rows="7" placeholder="輸入今日/段考考試彙整 (可換行)..."></textarea>
    </div>
    <div>
      <label for="formalHomework">✍️ 正式作業內容：</label>
      <textarea id="formalHomework" rows="7" placeholder="輸入今日/各科作業彙整 (可換行)..."></textarea>
    </div>
  </div>

  <!-- 5. 下方：全寬度 備註 / 嘉言錄 -->
  <div class="form-group">
    <label for="formalNote">📝 備註 / 嘉言錄（最下方橫跨整欄）：</label>
    <textarea id="formalNote" rows="2" placeholder="輸入班費、講義費、宣導注意事項或嘉言錄..."></textarea>
  </div>

  <!-- 6. 主要操作按鈕 -->
  <button class="btn btn-preview" onclick="handleRead()">
    ☁️ 讀取雲端投影片內容
  </button> 
  
  <button class="btn btn-submit" onclick="handleWrite()">
    💾 修改並寫入雲端簡報
  </button>

  <div id="statusBox" class="status-box"></div>

  <!-- 7. 本機離線草稿暫存區 (鏡像配置) -->
  <div class="draft-section">
    <div class="draft-header">
      <div class="draft-title">💾 本機離線草稿暫存區</div>
      <div class="draft-status" id="draftNotice">(目前無草稿)</div>
    </div>

    <div class="form-group" style="margin-bottom:12px;">
      <label>📊 暫存：有成績科目：</label>
      <div class="chip-container" id="draftScoreChips">
        <div class="chip" data-sub="國文" onclick="toggleDraftChip(this)">國文</div>
        <div class="chip" data-sub="英語" onclick="toggleDraftChip(this)">英語</div>
        <div class="chip" data-sub="數學" onclick="toggleDraftChip(this)">數學</div>
        <div class="chip" data-sub="自然" onclick="toggleDraftChip(this)">自然</div>
        <div class="chip" data-sub="歷史" onclick="toggleDraftChip(this)">歷史</div>
        <div class="chip" data-sub="地理" onclick="toggleDraftChip(this)">地理</div>
        <div class="chip" data-sub="公民" onclick="toggleDraftChip(this)">公民</div>
      </div>
    </div>

    <div class="grid-2col form-group" style="margin-bottom:12px;">
      <div>
        <label for="draftExam">📌 暫存考試：</label>
        <textarea id="draftExam" rows="4" placeholder="離線時輸入考試草稿..." oninput="autoSaveDraft()"></textarea>
      </div>
      <div>
        <label for="draftHomework">✍️ 暫存作業：</label>
        <textarea id="draftHomework" rows="4" placeholder="離線時輸入作業草稿..." oninput="autoSaveDraft()"></textarea>
      </div>
    </div>

    <div class="form-group" style="margin-bottom:12px;">
      <label for="draftNote">📝 暫存備註 / 嘉言錄：</label>
      <textarea id="draftNote" rows="2" placeholder="離線時輸入備註草稿..." oninput="autoSaveDraft()"></textarea>
    </div>

    <div class="action-row">
      <button class="btn btn-sm btn-warning" onclick="copyDraftToFormal()">
        ⚡ 一鍵複製暫存內容到正式區
      </button>
      <button class="btn btn-sm btn-secondary" onclick="loadDraftForCurrentDate()">
        🔄 讀取暫存
      </button>
      <button class="btn btn-sm btn-danger" onclick="clearDraftForCurrentDate()">
        🗑️ 清除暫存
      </button>
    </div>
  </div>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxm7i2Zh80lsjZp5Mf3TkyeEQvurZEcEqHhEdDrbNU7eNbRyalwubozpI5Ed7wcm-XpTg/exec";

  async function hashPassword(plainText) {
    if (!plainText) return "";
    const encoder = new TextEncoder();
    const data = encoder.encode(plainText);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function sendJsonpRequest(action, dataParams = {}) {
    return new Promise((resolve, reject) => {
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("YOUR_DEPLOYMENT_ID")) {
        reject(new Error("尚未設定正確的 GAS_WEB_APP_URL 部署網址。"));
        return;
      }

      const callbackName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      const script = document.createElement('script');
      
      script.crossOrigin = "anonymous";

      const queryParams = new URLSearchParams({
        action: action,
        callback: callbackName,
        _ts: Date.now(),
        ...dataParams
      });

      const fullUrl = `${GAS_WEB_APP_URL}?${queryParams.toString()}`;

      const timer = setTimeout(() => {
        cleanup();
        reject(new Error("連線逾時：請確認網路連線或 GAS 權限設定為「所有人」。"));
      }, 12000);

      function cleanup() {
        clearTimeout(timer);
        if (window[callbackName]) delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[callbackName] = (response) => {
        cleanup();
        if (response && response.status === "error") {
          reject(new Error(response.message || "後端處理發生錯誤"));
        } else {
          resolve(response);
        }
      };

      script.onerror = () => {
        cleanup();
        reject(new Error("連線失敗：JSONP 載入失敗，請確認網路連線。"));
      };

      script.src = fullUrl;
      document.body.appendChild(script);
    });
  }

  function showStatus(msg, isError = false) {
    const box = document.getElementById("statusBox");
    box.style.display = "block";
    box.className = "status-box " + (isError ? "status-error" : "status-success");
    box.innerText = msg;
  }

  function initDatePicker() {
    const dateInput = document.getElementById("targetDate");
    const todayStr = new Date().toISOString().split('T')[0];
    dateInput.value = todayStr;
  }

  function shiftDate(offset) {
    const dateInput = document.getElementById("targetDate");
    const currentDate = new Date(dateInput.value || new Date());
    currentDate.setDate(currentDate.getDate() + offset);
    dateInput.value = currentDate.toISOString().split('T')[0];
    onDateChange();
  }

  /* Chip 標籤點選互動 */
  function toggleChip(el) {
    el.classList.toggle("active");
  }

  function toggleDraftChip(el) {
    el.classList.toggle("active");
    autoSaveDraft();
  }

  function getActiveChips(containerId) {
    const container = document.getElementById(containerId);
    const activeNodes = container.querySelectorAll(".chip.active");
    return Array.from(activeNodes).map(node => node.getAttribute("data-sub"));
  }

  function setActiveChips(containerId, subjectList) {
    const container = document.getElementById(containerId);
    const chips = container.querySelectorAll(".chip");
    chips.forEach(chip => {
      const sub = chip.getAttribute("data-sub");
      if (subjectList && subjectList.includes(sub)) {
        chip.classList.add("active");
      } else {
        chip.classList.remove("active");
      }
    });
  }

  /* 離線草稿 (以整日為單位快照) */
  function getDraftKey() {
    const date = document.getElementById("targetDate").value;
    return `contact_daily_draft_${date}`;
  }

  function autoSaveDraft() {
    const key = getDraftKey();
    const draftData = {
      exam: document.getElementById("draftExam").value,
      homework: document.getElementById("draftHomework").value,
      note: document.getElementById("draftNote").value,
      scoreSubjects: getActiveChips("draftScoreChips"),
      timestamp: new Date().toLocaleTimeString()
    };
    localStorage.setItem(key, JSON.stringify(draftData));
    updateDraftNotice(true, draftData.timestamp);
  }

  function loadDraftForCurrentDate() {
    const key = getDraftKey();
    const saved = localStorage.getItem(key);
    if (saved) {
      const draftData = JSON.parse(saved);
      document.getElementById("draftExam").value = draftData.exam || "";
      document.getElementById("draftHomework").value = draftData.homework || "";
      document.getElementById("draftNote").value = draftData.note || "";
      setActiveChips("draftScoreChips", draftData.scoreSubjects || []);
      updateDraftNotice(true, draftData.timestamp);
    } else {
      document.getElementById("draftExam").value = "";
      document.getElementById("draftHomework").value = "";
      document.getElementById("draftNote").value = "";
      setActiveChips("draftScoreChips", []);
      updateDraftNotice(false);
    }
  }

  function smartMergeText(existingVal, newVal) {
    existingVal = (existingVal || "").trim();
    newVal = (newVal || "").trim();
    if (!existingVal) return newVal;
    if (!newVal) return existingVal;
    if (existingVal === newVal || existingVal.includes(newVal)) return existingVal;
    return `${existingVal}\n${newVal}`;
  }

  function copyDraftToFormal() {
    const draftExam = document.getElementById("draftExam").value;
    const draftHomework = document.getElementById("draftHomework").value;
    const draftNote = document.getElementById("draftNote").value;
    const draftScores = getActiveChips("draftScoreChips");

    if (!draftExam && !draftHomework && !draftNote && draftScores.length === 0) {
      return alert("目前草稿區尚無內容可複製！");
    }

    const currentExam = document.getElementById("formalExam").value;
    const currentHomework = document.getElementById("formalHomework").value;
    const currentNote = document.getElementById("formalNote").value;

    document.getElementById("formalExam").value = smartMergeText(currentExam, draftExam);
    document.getElementById("formalHomework").value = smartMergeText(currentHomework, draftHomework);
    document.getElementById("formalNote").value = smartMergeText(currentNote, draftNote);

    const formalScores = new Set([...getActiveChips("formalScoreChips"), ...draftScores]);
    setActiveChips("formalScoreChips", Array.from(formalScores));

    showStatus("⚡ 已一鍵同步整日草稿至正式區！");
  }

  function clearDraftForCurrentDate() {
    const key = getDraftKey();
    if (confirm("確定要清除本日的本機暫存草稿嗎？")) {
      localStorage.removeItem(key);
      document.getElementById("draftExam").value = "";
      document.getElementById("draftHomework").value = "";
      document.getElementById("draftNote").value = "";
      setActiveChips("draftScoreChips", []);
      updateDraftNotice(false);
      showStatus("🧹 已成功清除本日的本機草稿。");
    }
  }

  function update
